name: Generar y publicar reporte diario

on:
  workflow_dispatch:
  schedule:
    # Ejecuta todos los días 11:00 UTC (cambia a tu hora)
    - cron: '0 11 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r generator/requirements.txt

      - name: Generar dashboard
        run: |
          python generator/generate_report.py

      - name: Copiar CSS a dist
        run: |
          cp site/style.css dist/style.css

      - name: Subir artefacto para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
